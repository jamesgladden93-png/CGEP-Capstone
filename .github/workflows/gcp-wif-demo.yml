name: GCP WIF Demo

on:
  workflow_dispatch:
  push:
    branches: [lab-5.4-cgep]

permissions:
  id-token: write # required to mint the OIDC token
  contents: read

jobs:
  wif-auth-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/870067517337/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: cgep-grc-gate-sa@lab-24-grcengineer.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prove keyless read-only access
        run: |
          gcloud config list account
          gcloud storage ls --project=lab-24-grcengineer || echo "No buckets (expected in empty project) - auth itself succeeded"
